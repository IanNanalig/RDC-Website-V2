name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify no secrets or generated artifacts are tracked
        shell: bash
        run: |
          set -euo pipefail
          tracked_files="$(git ls-files)"
          forbidden_regex='(^|/)(\.env|\.env\..*|.*\.env\.backup.*|db\.sqlite3|.*\.sqlite3)$|(^|/)(node_modules|dist|staticfiles|\.venv|venv)(/|$)'
          allowed_regex='(^|/)\.env\.example$'
          violations="$(echo "$tracked_files" | grep -E "$forbidden_regex" | grep -Ev "$allowed_regex" || true)"
          if [ -n "$violations" ]; then
            echo "Forbidden secret/generated files are tracked:"
            echo "$violations"
            echo "Remove these files from git. Do not commit real .env files, databases, build outputs, or virtualenvs."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Cache Node modules
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install and build frontend
        working-directory: ./frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Run frontend lint
        working-directory: ./frontend
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run backend checks, migrations and tests
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: rdc_site.settings
          # CI should provide a secret via repository secrets; fall back to a long test-only secret.
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-production-safety-secret-with-more-than-50-characters-2026' }}
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: |
          python manage.py migrate --noinput
          python manage.py test projects --verbosity=2

      - name: Run Django deploy check
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: rdc_site.settings
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-production-safety-secret-with-more-than-50-characters-2026' }}
          DEBUG: "False"
          ALLOWED_HOSTS: "example.com"
          CORS_ALLOWED_ORIGINS: "https://example.com"
          CSRF_TRUSTED_ORIGINS: "https://example.com"
          FRONTEND_BASE_URL: "https://example.com"
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_PROXY_SSL_HEADER: "True"
          SECURE_HSTS_SECONDS: "0"
        run: |
          set -euo pipefail
          python manage.py check --deploy 2>&1 | tee /tmp/django-deploy-check.txt
          unexpected="$(grep -E "security\.W[0-9]+" /tmp/django-deploy-check.txt | grep -v "security.W004" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected Django deploy-check warning(s):"
            echo "$unexpected"
            exit 1
          fi

      - name: Collect static files
        working-directory: ./backend
        env:
          DJANGO_SETTINGS_MODULE: rdc_site.settings
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY || 'ci-production-safety-secret-with-more-than-50-characters-2026' }}
          DEBUG: "False"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: python manage.py collectstatic --noinput

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
