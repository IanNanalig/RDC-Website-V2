name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install and build frontend
        working-directory: ./
        run: |
          npm ci
          npm run build

      - name: Run frontend lint
        run: npm run lint

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run backend checks, migrations and tests
        env:
          DJANGO_SETTINGS_MODULE: rdc_site.settings
          # CI should provide a secret via repository secrets; fall back to a test-only secret.
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DEBUG: "False"
        run: |
          python backend/manage.py migrate --noinput
          # Run a fast smoke test first to fail early on obvious regressions
          python backend/manage.py test projects.tests.test_smoke || (echo 'Smoke test failed' && exit 1)
          # Run full backend test suite
          python backend/manage.py test --verbosity=2

      - name: Collect static files
        run: python backend/manage.py collectstatic --noinput
