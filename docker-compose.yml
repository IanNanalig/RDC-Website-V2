version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: rdc_db
      POSTGRES_USER: rdc
      POSTGRES_PASSWORD: rdc
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    command: gunicorn rdc_site.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: "dev-secret"
      DEBUG: "False"
      POSTGRES_DB: rdc_db
      POSTGRES_USER: rdc
      POSTGRES_PASSWORD: rdc
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: rdc_site.settings
    depends_on:
      - db
    volumes:
      - ./backend:/app/backend:ro

volumes:
  db_data:
