version: "3.8"
services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: rdc_db
      POSTGRES_USER: rdc
      POSTGRES_PASSWORD: rdc
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdc"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build: .
    command: gunicorn rdc_site.wsgi:application --bind 0.0.0.0:8000 --workers 3
    # Django loads this file for runserver; Compose must pass it explicitly
    # because the Docker image intentionally excludes local secret files.
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      RUN_DJANGO_STARTUP_TASKS: "true"
      SECRET_KEY: "${SECRET_KEY:-dev-secret}"
      DEBUG: "False"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}"
      POSTGRES_DB: rdc_db
      POSTGRES_USER: rdc
      POSTGRES_PASSWORD: rdc
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: rdc_site.settings
      # Validator document AI runs in this web request by default. Set this to
      # worker only when the local worker service is intentionally enabled.
      DOCUMENT_AI_PROCESSING_MODE: "${DOCUMENT_AI_PROCESSING_MODE:-inline}"
      # Local Compose remains usable when only the web service is started.
      # Set this false only when exercising the local redis/worker path.
      CELERY_TASK_ALWAYS_EAGER: "${CELERY_TASK_ALWAYS_EAGER:-true}"
      FRONTEND_BASE_URL: "${FRONTEND_BASE_URL:-http://localhost:5173}"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: celery -A rdc_site worker --loglevel=INFO --concurrency=1
    environment:
      RUN_DJANGO_STARTUP_TASKS: "false"
      SECRET_KEY: "${SECRET_KEY:-dev-secret}"
      DEBUG: "False"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}"
      POSTGRES_DB: rdc_db
      POSTGRES_USER: rdc
      POSTGRES_PASSWORD: rdc
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: rdc_site.settings
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/0"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_PRIMARY_MODEL: "${GROQ_PRIMARY_MODEL:-llama-3.1-8b-instant}"
      GROQ_BACKUP_MODEL: "${GROQ_BACKUP_MODEL:-llama-3.3-70b-versatile}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
