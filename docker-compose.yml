version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: rdc_db
      POSTGRES_USER: rdc
      POSTGRES_PASSWORD: rdc
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rdc"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  web:
    build: .
    command: gunicorn rdc_site.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: "${SECRET_KEY:-dev-secret}"
      DEBUG: "False"
      POSTGRES_DB: rdc_db
      POSTGRES_USER: rdc
      POSTGRES_PASSWORD: rdc
      POSTGRES_HOST: db
      DJANGO_SETTINGS_MODULE: rdc_site.settings
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app/backend:ro

volumes:
  db_data:
